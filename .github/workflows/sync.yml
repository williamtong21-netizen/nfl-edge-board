name: Sync NFL data
on:
  schedule:
    - cron: "17 */3 * * *"
    # inactives come out ~90 minutes before kickoff; three staggered runs per window (GitHub sometimes runs late or
    # skips one), set in UTC so they cover both daylight time (UTC-4) and standard time after Nov 1 (UTC-5)
    - cron: "15,45 12 * * 0"      # Sun 8:15-8:45 AM EDT: international 9:30 AM games
    - cron: "45 15 * * 0,6"       # Sat/Sun 11:45 AM EDT (10:45 EST): 1:00 games
    - cron: "15,45 16 * * 0,6"    #   12:15, 12:45 PM EDT
    - cron: "45 18 * * 0,6"       # Sat/Sun 2:45 PM EDT (1:45 EST): 4:05/4:25 games
    - cron: "15,45 19 * * 0,6"    #   3:15, 3:45 PM EDT
    - cron: "55 22 * * 0,1,4,6"   # Thu/Sat/Sun/Mon 6:55 PM EDT (5:55 EST): night games
    - cron: "25,55 23 * * 0,1,4,6" #   7:25, 7:55 PM EDT (6:25, 6:55 EST)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: sync
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull lines, props, injuries, lineups, weather and analytics
        env:
          EDGE_OUT: data
          EDGE_DATA: state
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_MIN_HOURS: "12"
          ODDS_API_PROPS: ${{ vars.ODDS_API_PROPS }}
        run: python sync.py
      - name: Publish the new data
        run: |
          git config user.name "edge-board-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data state
          git diff --cached --quiet || git commit -m "Data sync $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -X theirs -q || true
          git push
