name: News alerts
on:
  schedule:
    - cron: "7,27,47 12-23 * * *"   # 8 AM - 7:47 PM EDT (7 AM - 6:47 PM EST)
    - cron: "7,27,47 0-4 * * *"     # 8 PM - 12:47 AM EDT
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: news
  cancel-in-progress: false
jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check injury reports and headlines
        env:
          EDGE_OUT: data
          EDGE_DATA: state
          NTFY_TOPIC: edgeboard-gjmjta8ulgns
        run: python news.py
      - name: Save what was sent
        run: |
          git config user.name "edge-board-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/news_state.json
          git diff --cached --quiet && exit 0
          git commit -q -m "News check $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -X theirs -q || true
          git push -q || (sleep 5 && git pull --rebase -X theirs -q && git push -q)
